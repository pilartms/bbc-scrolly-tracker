name: Weekly scrape

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  workflow_dispatch:        # Allows manual runs from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Rebuild dashboard
        run: python build_dashboard.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json docs/index.html
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +%Y-%m-%d)"
          git push

      - name: Read email subject
        id: subject
        run: echo "value=$(cat scraper_subject.txt)" >> $GITHUB_OUTPUT

      - name: Send summary email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.subject.outputs.value }}
          to: ${{ secrets.EMAIL_TO }}
          from: BBC Scrolly Tracker <${{ secrets.EMAIL_USERNAME }}>
          body: file://scraper_summary.txt
